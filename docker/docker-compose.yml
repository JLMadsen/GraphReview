# GraphReview Docker Compose layout.
#
# Run from the repo root with:
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up
# or `cd docker && cp .env.example .env` (fill in values) `&& docker compose up`.
#
# Every `${VAR:-default}` below falls back to the real-world service this
# app already depended on, so a normal setup needs none of them set — they
# exist for running on a closed network against internal mirrors instead
# (GitHub Enterprise/proxy, a mirrored Docker Hub image, a mirrored Alpine
# package CDN, an internal CA). See docker/.env.example's "Closed-network / mirror support"
# section for what each one does. npm's registry is deliberately *not*
# covered — see that same section.

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: app
      additional_contexts:
        # Internal CA certificates (*.crt/*.pem) — see docker/certs/README.md.
        certs: ${CA_CERT_DIR:-./certs}
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-alpine}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      LOCAL_REPOS_PATH: ${LOCAL_REPOS_PATH}
      SESSION_SECRET: ${SESSION_SECRET}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      GITHUB_WEB_URL: ${GITHUB_WEB_URL:-}
      GITLAB_API_URL: ${GITLAB_API_URL:-}
      GITLAB_WEB_URL: ${GITLAB_WEB_URL:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-}
    ports:
      # Only app's web port is published to the host by default. APP_PORT
      # picks the host side (default 3470 — 3000 is taken by half the dev
      # tools out there); inside the container Next.js always listens on 3000.
      - "${APP_PORT:-3470}:3000"
    volumes:
      - repo_cache:/data/repos
      - ${LOCAL_REPOS_PATH}:/data/local-repos:ro
    extra_hosts:
      # Docker Desktop (Windows/Mac) already resolves host.docker.internal;
      # this makes it resolve on native Linux Docker Engine too, so a
      # locally-run AI server (README's "Running your own AI") is reachable
      # from inside the container the same way on both.
      - "host.docker.internal:host-gateway"
    depends_on:
      - neo4j
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
      additional_contexts:
        # Internal CA certificates (*.crt/*.pem) — see docker/certs/README.md.
        certs: ${CA_CERT_DIR:-./certs}
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-alpine}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    environment:
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: ${REDIS_URL}
      LOCAL_REPOS_PATH: ${LOCAL_REPOS_PATH}
      SESSION_SECRET: ${SESSION_SECRET}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      GITHUB_WEB_URL: ${GITHUB_WEB_URL:-}
      GITLAB_API_URL: ${GITLAB_API_URL:-}
      GITLAB_WEB_URL: ${GITLAB_WEB_URL:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-}
    # No ports published — the worker has no HTTP surface.
    volumes:
      - repo_cache:/data/repos
      - ${LOCAL_REPOS_PATH}:/data/local-repos:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - neo4j
      - redis
    restart: unless-stopped

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5}
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    # Not published to the host by default: only app/worker reach it
    # over the internal Compose network. Add a `ports:` mapping yourself
    # (e.g. "7474:7474" / "7687:7687") to use the Neo4j Browser for debugging.
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    # Not published to the host by default — BullMQ backing store,
    # internal to app/worker only.
    restart: unless-stopped

volumes:
  neo4j_data:
  repo_cache:
