<svg xmlns="http://www.w3.org/2000/svg" width="680" height="385" viewBox="0 0 680 385" role="img" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Folder grouping versus Louvain grouping of the same six files</title>
  <desc>Left: files grouped by folder into ui, api and db; each feature's files are split across all three groups and every import crosses a group boundary. Right: Louvain groups the same files by their imports into a checkout group and a login group; every import stays inside its group.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="385" fill="#FFFFFF"/>

  <!-- Left panel: by folder -->
  <rect x="20" y="20" width="305" height="310" rx="8" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="172" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">By folder (in use now)</text>

  <rect x="35" y="60" width="275" height="75" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
  <text x="48" y="78" font-size="14" font-weight="600" fill="#444441">ui/</text>
  <rect x="35" y="150" width="275" height="75" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
  <text x="48" y="168" font-size="14" font-weight="600" fill="#444441">api/</text>
  <rect x="35" y="240" width="275" height="75" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
  <text x="48" y="258" font-size="14" font-weight="600" fill="#444441">db/</text>

  <rect x="50" y="92" width="115" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="107" y="111" text-anchor="middle" font-size="12" fill="#712B13">CheckoutForm</text>
  <rect x="190" y="92" width="115" height="30" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="247" y="111" text-anchor="middle" font-size="12" fill="#3C3489">LoginForm</text>
  <rect x="50" y="182" width="115" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="107" y="201" text-anchor="middle" font-size="12" fill="#712B13">checkout</text>
  <rect x="190" y="182" width="115" height="30" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="247" y="201" text-anchor="middle" font-size="12" fill="#3C3489">login</text>
  <rect x="50" y="272" width="115" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="107" y="291" text-anchor="middle" font-size="12" fill="#712B13">orders</text>
  <rect x="190" y="272" width="115" height="30" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="247" y="291" text-anchor="middle" font-size="12" fill="#3C3489">users</text>

  <g stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="107" y1="122" x2="107" y2="180"/>
    <line x1="247" y1="122" x2="247" y2="180"/>
    <line x1="107" y1="212" x2="107" y2="270"/>
    <line x1="247" y1="212" x2="247" y2="270"/>
  </g>

  <!-- Right panel: by imports (Louvain) -->
  <rect x="355" y="20" width="305" height="310" rx="8" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="507" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">By imports (Louvain, removed)</text>

  <rect x="370" y="60" width="135" height="255" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
  <text x="383" y="78" font-size="14" font-weight="600" fill="#444441">Checkout</text>
  <rect x="520" y="60" width="135" height="255" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
  <text x="533" y="78" font-size="14" font-weight="600" fill="#444441">Login</text>

  <rect x="380" y="92" width="115" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="437" y="111" text-anchor="middle" font-size="12" fill="#712B13">ui/CheckoutForm</text>
  <rect x="380" y="182" width="115" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="437" y="201" text-anchor="middle" font-size="12" fill="#712B13">api/checkout</text>
  <rect x="380" y="272" width="115" height="30" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="437" y="291" text-anchor="middle" font-size="12" fill="#712B13">db/orders</text>
  <rect x="530" y="92" width="115" height="30" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="587" y="111" text-anchor="middle" font-size="12" fill="#3C3489">ui/LoginForm</text>
  <rect x="530" y="182" width="115" height="30" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="587" y="201" text-anchor="middle" font-size="12" fill="#3C3489">api/login</text>
  <rect x="530" y="272" width="115" height="30" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="587" y="291" text-anchor="middle" font-size="12" fill="#3C3489">db/users</text>

  <g stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="437" y1="122" x2="437" y2="180"/>
    <line x1="587" y1="122" x2="587" y2="180"/>
    <line x1="437" y1="212" x2="437" y2="270"/>
    <line x1="587" y1="212" x2="587" y2="270"/>
  </g>

  <!-- Legend -->
  <rect x="130" y="352" width="14" height="14" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
  <text x="152" y="364" font-size="12" fill="#5F5E5A">Checkout feature file</text>
  <rect x="310" y="352" width="14" height="14" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="332" y="364" font-size="12" fill="#5F5E5A">Login feature file</text>
  <line x1="470" y1="359" x2="498" y2="359" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="506" y="364" font-size="12" fill="#5F5E5A">Imports</text>
</svg>
